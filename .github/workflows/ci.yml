name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  rust:
    name: Rust (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - name: Install Tauri system dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev libxdo-dev libssl-dev
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - run: cargo test --workspace --locked

  ui:
    name: UI type-check
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ui
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: lts/*
          cache: npm
          cache-dependency-path: ui/package-lock.json
      - run: npm ci
      - run: npm run check
      - run: npm run build

  windows-bundle:
    name: Windows app build
    needs: [rust, ui]
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: lts/*
          cache: npm
          cache-dependency-path: ui/package-lock.json
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          key: bundle
      - run: npm ci
        working-directory: ui
      # The Tauri CLI only searches downwards for src-tauri, so point it there from ui/. The extra
      # config builds the launcher shim and ships it next to the app (ADR 0007).
      - run: npm run tauri build -- --config ../src-tauri/tauri.bundle.conf.json
        working-directory: ui
        env:
          TAURI_APP_PATH: ${{ github.workspace }}/src-tauri
      - name: Check that the installer puts the launcher shim next to the app
        shell: pwsh
        run: |
          $msi = Get-ChildItem target/release/bundle/msi/*.msi | Select-Object -First 1
          $out = Join-Path $env:RUNNER_TEMP 'msi-content'
          $install = Start-Process msiexec.exe -Wait -PassThru -ArgumentList @('/a', "`"$($msi.FullName)`"", '/qn', "TARGETDIR=`"$out`"")
          if ($install.ExitCode -ne 0) { throw "msiexec /a failed with $($install.ExitCode)" }
          Get-ChildItem -Recurse -File $out | ForEach-Object { $_.FullName }
          $shim = Get-ChildItem -Recurse -File $out -Filter 'mccboard-shim.exe' | Select-Object -First 1
          if (-not $shim) { throw 'mccboard-shim.exe is not in the installer' }
          $app = Get-ChildItem -Path $shim.DirectoryName -File -Filter '*.exe' | Where-Object Name -ne 'mccboard-shim.exe'
          if (-not $app) { throw "no app program next to $($shim.FullName)" }
      - uses: actions/upload-artifact@v7
        with:
          name: mccboard-windows
          path: |
            target/release/bundle/nsis/*.exe
            target/release/bundle/msi/*.msi
          if-no-files-found: error
