name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  rust:
    name: Rust (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - name: Install Tauri system dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev libxdo-dev libssl-dev
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - run: cargo test --workspace --locked

  ui:
    name: UI type-check
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ui
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: lts/*
          cache: npm
          cache-dependency-path: ui/package-lock.json
      - run: npm ci
      - run: npm run check
      - run: npm run build

  install-script:
    name: install.sh
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: shellcheck
        run: |
          if ! command -v shellcheck >/dev/null; then
            sudo apt-get update
            sudo apt-get install -y shellcheck
          fi
          shellcheck --version
          shellcheck install.sh scripts/test-install.sh
      # The test makes releases with a stand-in mccboard and serves them from a folder, with no
      # network and no build. The test script itself runs under sh, which is dash on Ubuntu.
      - name: Test install.sh under dash and bash
        run: sh scripts/test-install.sh dash bash
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --locked -p mccboard-cli
      # The archive holds the debug build of this runner under the name of the x86_64 release.
      # This step checks the script with the real CLI, and release.yml checks the static binaries.
      - name: Install the CLI built here, packed as the release packs it
        run: |
          version=$(cargo metadata --no-deps --format-version 1 --locked |
            jq -r '.packages[] | select(.name == "mccboard-cli") | .version')
          name="mccboard-$version-x86_64-unknown-linux-musl"
          serve="$RUNNER_TEMP/releases/v$version"
          mkdir -p "$serve" "$RUNNER_TEMP/staging"
          cp target/debug/mccboard LICENSE README.md "$RUNNER_TEMP/staging/"
          tar -czf "$serve/$name.tar.gz" --owner=0 --group=0 --numeric-owner \
            -C "$RUNNER_TEMP/staging" mccboard LICENSE README.md
          (cd "$serve" && sha256sum "$name.tar.gz" > "$name.tar.gz.sha256")
          MCCBOARD_VERSION="$version" MCCBOARD_DOWNLOAD_URL="file://$serve" \
            MCCBOARD_INSTALL_DIR="$RUNNER_TEMP/bin" sh install.sh --no-setup
          cmp target/debug/mccboard "$RUNNER_TEMP/bin/mccboard"
          reported=$("$RUNNER_TEMP/bin/mccboard" --version)
          if [ "$reported" != "mccboard $version" ]; then
            echo "::error::The installed CLI says '$reported', the workspace is $version."
            exit 1
          fi

  windows-bundle:
    name: Windows app build
    needs: [rust, ui]
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: lts/*
          cache: npm
          cache-dependency-path: ui/package-lock.json
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          key: bundle
      - run: npm ci
        working-directory: ui
      # The Tauri CLI only searches downwards for src-tauri, so point it there from ui/. The extra
      # config builds the launcher shim (ADR 0007) and the CLI, and ships them next to the app.
      - run: npm run tauri build -- --config ../src-tauri/tauri.bundle.conf.json
        working-directory: ui
        env:
          TAURI_APP_PATH: ${{ github.workspace }}/src-tauri
      - name: Check that both installers put the launcher shim and the CLI next to the app
        shell: pwsh
        run: |
          $version = (cargo metadata --no-deps --format-version 1 --locked | ConvertFrom-Json).packages |
            Where-Object name -eq 'mccboard-app' | ForEach-Object version
          function Test-Content($out, $installer) {
            Get-ChildItem -Recurse -File $out | ForEach-Object { $_.FullName }
            $shim = Get-ChildItem -Recurse -File $out -Filter 'mccboard-shim.exe' | Select-Object -First 1
            if (-not $shim) { throw "mccboard-shim.exe is not in the $installer" }
            $cli = Join-Path $shim.DirectoryName 'mccboard.exe'
            if (-not (Test-Path $cli)) { throw "the CLI, mccboard.exe, is not next to the shim in the $installer" }
            $app = Get-ChildItem -Path $shim.DirectoryName -File -Filter '*.exe' |
              Where-Object { $_.Name -notin 'mccboard-shim.exe', 'mccboard.exe' }
            if (-not $app) { throw "no app program next to $($shim.FullName) in the $installer" }
            $cliVersion = & $cli --version
            if ($cliVersion -ne "mccboard $version") { throw "the $installer's CLI says '$cliVersion', the app is $version" }
          }
          $msi = Get-ChildItem target/release/bundle/msi/*.msi | Select-Object -First 1
          $out = Join-Path $env:RUNNER_TEMP 'msi-content'
          $install = Start-Process msiexec.exe -Wait -PassThru -ArgumentList @('/a', "`"$($msi.FullName)`"", '/qn', "TARGETDIR=`"$out`"")
          if ($install.ExitCode -ne 0) { throw "msiexec /a failed with $($install.ExitCode)" }
          Test-Content $out 'MSI'
          # 7-Zip, on the Windows runners, unpacks an NSIS installer without running it.
          $nsis = Get-ChildItem target/release/bundle/nsis/*.exe | Select-Object -First 1
          $out = Join-Path $env:RUNNER_TEMP 'nsis-content'
          7z x $nsis.FullName "-o$out" -y | Out-Null
          if ($LASTEXITCODE -ne 0) { throw "7z failed with $LASTEXITCODE" }
          Test-Content $out 'NSIS installer'
      - uses: actions/upload-artifact@v7
        with:
          name: mccboard-windows
          path: |
            target/release/bundle/nsis/*.exe
            target/release/bundle/msi/*.msi
          if-no-files-found: error

  linux-bundle:
    name: Linux app build
    needs: [rust, ui]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Install Tauri system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev libxdo-dev libssl-dev
      - uses: actions/setup-node@v7
        with:
          node-version: lts/*
          cache: npm
          cache-dependency-path: ui/package-lock.json
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          key: bundle
      - run: npm ci
        working-directory: ui
      # No extra config here: on Linux the launchers are scripts that mccboard writes and the CLI
      # is installed on its own. The packages hold the app alone.
      - run: npm run tauri build
        working-directory: ui
        env:
          TAURI_APP_PATH: ${{ github.workspace }}/src-tauri
      - uses: actions/upload-artifact@v7
        with:
          name: mccboard-linux
          path: |
            target/release/bundle/deb/*.deb
            target/release/bundle/rpm/*.rpm
            target/release/bundle/appimage/*.AppImage
          if-no-files-found: error
