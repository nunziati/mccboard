[package]
name = "mccboard-app"
description = "mccboard's desktop app: binds the core to Tauri commands, tray and windows."
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[lib]
# Distinct from the binary name (cargo#8519 on Windows).
name = "mccboard_app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[[bin]]
name = "mccboard-app"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
jiff.workspace = true
mccboard-core.workspace = true
notify-debouncer-mini.workspace = true
serde.workspace = true
sys-locale = "0.3"
tauri = { version = "2", features = ["tray-icon"] }
# A second copy of the app hands its arguments to the running one and exits: a desktop
# profile's Start-menu shortcut (`--open-profile <uuid>`) on Windows, and on Linux a start from
# the app menu, which shows the window even where no tray icon can show.
tauri-plugin-single-instance = "2.5"
