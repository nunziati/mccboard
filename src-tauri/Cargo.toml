[package]
name = "mccboard-app"
description = "mccboard's desktop app: binds the core to Tauri commands, tray and windows."
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[lib]
# Distinct from the binary name (cargo#8519 on Windows).
name = "mccboard_app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[[bin]]
name = "mccboard-app"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
mccboard-core.workspace = true
notify-debouncer-mini.workspace = true
serde.workspace = true
tauri = { version = "2", features = [] }
