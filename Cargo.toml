[workspace]
members = ["crates/core", "crates/cli", "src-tauri"]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"
repository = "https://github.com/nunziati/mccboard"

[workspace.dependencies]
mccboard-core = { path = "crates/core" }
anyhow = "1"
clap = { version = "4", features = ["derive"] }
jiff = { version = "0.2", features = ["serde"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tempfile = "3"
thiserror = "2"
toml = "1"
toml_edit = "0.25"
notify = "8"
notify-debouncer-mini = "0.7"
winreg = "0.56"
windows-sys = "0.61"
